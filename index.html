<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Birthday!</title>
    <link rel="icon" type="image/x-icon" href="Dependencies/web-icon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Background Canvas -->
    <canvas id="flowerCanvas"></canvas>

    <div class="page-wrapper">
        <!-- Play Button Container -->
        <div class="btn-container" id="buttonContainer">
            <button class="gif-container" id="playButton" aria-label="Play experience">
                <img id="btnImg" src="Dependencies/play button start.png" alt="Play Button">
            </button>
        </div>

        <!-- 3D Carousel Container -->
        <div class="photo-frame hidden" id="photoFrame">
            <div class="carousel-viewport" id="carouselViewport">
                <div class="carrousel" id="carrousel"></div>
            </div>
        </div>
    </div>

    <!-- Modal Overlay -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-card">
            <button class="close-btn" id="closeModal" aria-label="Close modal">&times;</button>
            <img id="modalImg" src="" alt="Modal View">
            <div class="modal-content">
                <h2 id="modalTitle">Title</h2>
                <p id="modalDesc">Description</p>
            </div>
        </div>
    </div>

    <audio id="bgMusic" src="Dependencies/MYMP - Especially For You (Official Music Video).mp3" loop preload="auto"></audio>

    <script src="script.js"></script>
</body>
</html>
